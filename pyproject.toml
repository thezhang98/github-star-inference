[project]
name = "github-star-inference"
version = "0.1.0"
description = "MCP server that syncs and analyzes your GitHub stars"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
github-star = "github_star.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_star"]
